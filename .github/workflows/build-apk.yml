name: Build SONARA Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SDKMANAGER_OPTS: "-Djava.net.preferIPv4Stack=true"
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Verify Android SDK installation
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which java
          java -version
          which sdkmanager
          sdkmanager --list_installed

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root directory is missing: $SDK_ROOT"
            exit 1
          fi
          for required_dir in "platform-tools" "platforms/android-36.1" "build-tools/36.0.0"; do
            if [ ! -d "$SDK_ROOT/$required_dir" ]; then
              echo "::error::Required Android SDK component missing: $SDK_ROOT/$required_dir"
              exit 1
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Make gradlew executable and verify Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
